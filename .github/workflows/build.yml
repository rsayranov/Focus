name: Build Focus

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restore keystore
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/focus.jks"
        env:
          KEYSTORE_B64: ${{ secrets.FOCUS_KEYSTORE_B64 }}

      - name: Build release APK
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/focus.jks
          KEYSTORE_PASSWORD: ${{ secrets.FOCUS_KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: Focus-apk
          path: app/build/outputs/apk/release/*.apk
